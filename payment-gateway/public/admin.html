<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments Admin | CM Innovations</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18231d;background:#f4f7f5}*{box-sizing:border-box}body{margin:0;padding:28px}.shell{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.08em;color:#176b45}.muted{color:#748078;font-size:13px}.panel{background:white;border:1px solid #e2e9e4;border-radius:16px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid #e4eae6;border-radius:12px;padding:16px}.stat small{color:#77837b}.stat strong{display:block;font-size:24px;margin-top:7px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input{width:100%;padding:11px;border:1px solid #dce4df;border-radius:9px;margin-top:6px}label{font-size:12px;font-weight:650}.btn{background:#176b45;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.btn.secondary{background:#edf4ef;color:#176b45}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:300px;margin:0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0ee;white-space:nowrap}th{color:#68766e;font-size:11px;text-transform:uppercase}.tablewrap{overflow:auto}.pill{padding:4px 8px;border-radius:20px;background:#eef2ef;font-size:11px}.paid{background:#e9f7ee;color:#176b45}.pending{background:#fff5df;color:#875900}.hidden{display:none}.login{max-width:390px;margin:12vh auto}.login input{margin-bottom:12px}.error{color:#a32920;font-size:13px;margin-top:10px}@media(max-width:800px){body{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="top"><div><div class="brand">CM INNOVATIONS</div><h1>Payment management</h1><div class="muted">Administrator dashboard · captured payments and payment requests</div></div><button id="logout" class="btn secondary hidden">Sign out</button></div>
<section id="loginBox" class="panel login"><h2>Admin sign in</h2><label>Email</label><input id="loginEmail" type="email" autocomplete="username"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="loginBtn" class="btn">Sign in</button><div id="loginError" class="error"></div></section>
<div id="dashboard" class="hidden"><section class="grid"><div class="stat"><small>Captured total (loaded rows)</small><strong id="total">₹0</strong></div><div class="stat"><small>Orders</small><strong id="count">0</strong></div><div class="stat"><small>Paid</small><strong id="paid">0</strong></div><div class="stat"><small>Pending / other</small><strong id="pending">0</strong></div></section>
<section class="panel"><h2>Create payment request</h2><div class="formgrid"><div><label>Customer name</label><input id="rName"></div><div><label>Email</label><input id="rEmail" type="email"></div><div><label>Mobile with country code</label><input id="rPhone"></div><div><label>Amount (INR)</label><input id="rAmount" type="number" min="1" step="0.01"></div><div><label>Description</label><input id="rDescription"></div></div><p><button id="createRequest" class="btn">Generate Razorpay payment link</button> <span id="requestResult" class="muted"></span></p></section>
<section class="panel"><div class="toolbar"><h2 style="margin-right:auto">Transactions</h2><input id="search" placeholder="Search customer, email, payment ID"><button id="refresh" class="btn secondary">Refresh</button><button id="csv" class="btn secondary">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Amount</th><th>Status</th><th>Source</th><th>Payment ID</th><th>Date</th><th>Links</th></tr></thead><tbody id="rows"></tbody></table></div><div id="tableError" class="error"></div></section></div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js';import{initializeAppCheck,ReCaptchaV3Provider}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app-check.js';
const cfg={ apiKey:'AIzaSyAY0eJ0iAVxP2tn2RLe7wVNB8Q15Vnjd-g', authDomain:'cmb-40001.firebaseapp.com', projectId:'cmb-40001', storageBucket:'cmb-40001.firebasestorage.app', messagingSenderId:'294144253040', appId:'1:294144253040:web:852b7c378ee8049f4268b5', measurementId:'G-RX05KNR8Y3' };const app=initializeApp(cfg);
// Register your production reCAPTCHA Enterprise/App Check site key before enforcing App Check.
// initializeAppCheck(app,{provider:new ReCaptchaV3Provider('YOUR_RECAPTCHA_V3_SITE_KEY'),isTokenAutoRefreshEnabled:true});
const auth=getAuth(app),fn=getFunctions(app,'asia-south1');const list= httpsCallable(fn,'listAdminPayments'),create=httpsCallable(fn,'createAdminPaymentRequest');let items=[];
const $=id=>document.getElementById(id);$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('loginEmail').value,$('loginPassword').value);$('loginError').textContent='';}catch(e){$('loginError').textContent=e.message;}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async user=>{if(!user){$('loginBox').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');return;}try{await user.getIdToken(true);$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await refresh();}catch(e){$('tableError').textContent=e.message;}});
async function refresh(){try{const d=(await list({limit:100})).data;items=d.items||[];render();$('tableError').textContent='';}catch(e){$('tableError').textContent=e.message;}}
function money(p){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format((p||0)/100)}function render(){const q=$('search').value.toLowerCase();const rows=items.filter(x=>[x.customerName,x.customerEmail,x.paymentId,x.status].join(' ').toLowerCase().includes(q));$('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.customerName)}<br><span class="muted">${esc(x.customerEmail)}</span></td><td>${money(x.amount)}</td><td><span class="pill ${x.status==='PAID'?'paid':'pending'}">${esc(x.status)}</span></td><td>${esc(x.source||'')}</td><td>${esc(x.paymentId||'—')}</td><td>${x.createdAt?new Date(x.createdAt).toLocaleString('en-IN'):'—'}</td><td>${x.receiptUrl?`<a href="${escAttr(x.receiptUrl)}" target="_blank" rel="noopener">Receipt</a>`:''} ${x.paymentUrl?`<a href="${escAttr(x.paymentUrl)}" target="_blank" rel="noopener">Pay link</a>`:''}</td></tr>`).join('');const paid=items.filter(x=>x.status==='PAID');$('total').textContent=money(paid.reduce((s,x)=>s+(x.amount||0),0));$('count').textContent=items.length;$('paid').textContent=paid.length;$('pending').textContent=items.length-paid.length;}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function escAttr(s){return esc(s)}$('refresh').onclick=refresh;$('search').oninput=render;
$('createRequest').onclick=async()=>{const b=$('createRequest');b.disabled=true;try{const r=(await create({name:$('rName').value,email:$('rEmail').value,phone:$('rPhone').value,amountPaise:Math.round(Number($('rAmount').value)*100),description:$('rDescription').value})).data;$('requestResult').innerHTML=`Payment link: <a href="${escAttr(r.paymentUrl)}" target="_blank" rel="noopener">${esc(r.paymentUrl)}</a>`;await refresh();}catch(e){$('requestResult').textContent=e.message;}finally{b.disabled=false;}};
$('csv').onclick=()=>{const header=['Customer','Email','Phone','Amount paise','Status','Payment ID','Source','Created'];const data=items.map(x=>[x.customerName,x.customerEmail,x.customerPhone,x.amount,x.status,x.paymentId,x.source,x.createdAt]);const csv=[header,...data].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cm-innovations-payments.csv';a.click();URL.revokeObjectURL(a.href);};
</script></body></html>
