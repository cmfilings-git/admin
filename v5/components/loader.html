<!-- Minimal Book Page Loader -->
<style>
  :root {
    --book-width: 118px;
    --book-height: 78px;
    --book-accent: #0B57D0;
    --book-page-bg: #FFFFFF;
    --book-border: #CBD5E1;
    --book-line: #E2E8F0;
    --book-speed: 2.4s;
  }

  .book-loader-wrapper {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .book {
    position: relative;
    width: var(--book-width);
    height: var(--book-height);
    padding: 4px 5px 7px 5px;
    background-color: var(--book-accent);
    border-radius: 7px 7px 8px 8px;
    box-shadow:
      0 14px 28px -12px rgba(15, 23, 42, 0.16),
      0 4px 10px -4px rgba(15, 23, 42, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    box-sizing: border-box;
  }

  .book::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 14px;
    height: 7px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent 0%, rgba(15, 23, 42, 0.16) 50%, transparent 100%);
    border-radius: 0 0 4px 4px;
    pointer-events: none;
  }

  .book-stage {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 680px;
    perspective-origin: 50% 42%;
  }

  .book-stage::before {
    content: '';
    position: absolute;
    left: 1px;
    right: 1px;
    bottom: -2px;
    height: 4px;
    background-color: #E2E8F0;
    border-radius: 0 0 4px 4px;
    pointer-events: none;
  }

  .book-base-page {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background-color: var(--book-page-bg);
    border: 1px solid var(--book-border);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 7px;
    padding: 12px 9px;
    z-index: 0;
  }

  .book-base-page--left {
    left: 0;
    border-right: none;
    border-radius: 4px 0 0 4px;
    background-image: linear-gradient(to left, rgba(15, 23, 42, 0.055) 0%, rgba(15, 23, 42, 0.015) 7px, transparent 16px);
  }

  .book-base-page--right {
    right: 0;
    border-left: none;
    border-radius: 0 4px 4px 0;
    background-image: linear-gradient(to right, rgba(15, 23, 42, 0.055) 0%, rgba(15, 23, 42, 0.015) 7px, transparent 16px);
  }

  .book-spine {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, rgba(148, 163, 184, 0.35), rgba(100, 116, 139, 0.55) 50%, rgba(148, 163, 184, 0.35));
    z-index: 10;
    pointer-events: none;
  }

  .book-page {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    will-change: transform, z-index;
    animation: book-page-flip var(--book-speed) linear infinite;
    animation-delay: var(--page-delay, 0s);
  }

  .book-page:nth-child(3) { --page-delay: 0s; }
  .book-page:nth-child(4) { --page-delay: calc(var(--book-speed) * -0.25); }
  .book-page:nth-child(5) { --page-delay: calc(var(--book-speed) * -0.5); }
  .book-page:nth-child(6) { --page-delay: calc(var(--book-speed) * -0.75); }

  .book-page-face {
    position: absolute;
    inset: 0;
    background-color: var(--book-page-bg);
    border: 1px solid var(--book-border);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 7px;
    padding: 12px 9px;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    overflow: hidden;
  }

  .book-page-face--front {
    transform: rotateY(0deg) translateZ(0.1px);
    border-left: none;
    border-radius: 0 4px 4px 0;
    background-image: linear-gradient(to right, rgba(15, 23, 42, 0.055) 0%, rgba(15, 23, 42, 0.015) 7px, transparent 16px);
  }

  .book-page-face--back {
    transform: rotateY(180deg) translateZ(0.1px);
    border-right: none;
    border-radius: 4px 0 0 4px;
    background-image: linear-gradient(to left, rgba(15, 23, 42, 0.055) 0%, rgba(15, 23, 42, 0.015) 7px, transparent 16px);
  }

  .book-page-face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.055);
    opacity: 0;
    pointer-events: none;
    animation: book-page-shade var(--book-speed) linear infinite;
    animation-delay: var(--page-delay, 0s);
  }

  .book-line {
    display: block;
    height: 2px;
    border-radius: 9999px;
    background-color: var(--book-line);
  }

  .book-line--1 { width: 88%; }
  .book-line--2 { width: 100%; }
  .book-line--3 { width: 64%; }

  .book-label {
    margin-top: 22px;
    font-family: 'Outfit', 'Inter', system-ui, sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #64748B;
    animation: book-label-pulse var(--book-speed) ease-in-out infinite;
  }

  @keyframes book-page-flip {
    0% {
      transform: rotateY(0deg);
      z-index: 3;
      animation-timing-function: cubic-bezier(0.645, 0.045, 0.355, 1);
    }
    24.99% { z-index: 3; }
    25% { z-index: 4; }
    49.99% { z-index: 4; }
    50% {
      transform: rotateY(-180deg);
      z-index: 2;
    }
    74.99% {
      transform: rotateY(-180deg);
      z-index: 2;
    }
    75% {
      transform: rotateY(0deg);
      z-index: 1;
    }
    99.99% {
      transform: rotateY(0deg);
      z-index: 1;
    }
    100% {
      transform: rotateY(0deg);
      z-index: 3;
    }
  }

  @keyframes book-page-shade {
    0%, 50%, 100% { opacity: 0; }
    25% { opacity: 1; }
  }

  @keyframes book-label-pulse {
    0%, 100% { opacity: 0.48; }
    50% { opacity: 0.92; }
  }
</style>

<div class="book-loader-wrapper" role="status" aria-live="polite" aria-label="Loading">

    <div class="book-stage">
      <div class="book-base-page book-base-page--left">
        <span class="book-line book-line--1"></span>
        <span class="book-line book-line--2"></span>
        <span class="book-line book-line--3"></span>
      </div>
      <div class="book-base-page book-base-page--right">
        <span class="book-line book-line--1"></span>
        <span class="book-line book-line--2"></span>
        <span class="book-line book-line--3"></span>
      </div>
      <div class="book-page">
        <div class="book-page-face book-page-face--front">
          <span class="book-line book-line--1"></span>
          <span class="book-line book-line--2"></span>
          <span class="book-line book-line--3"></span>
        </div>
        <div class="book-page-face book-page-face--back">
          <span class="book-line book-line--1"></span>
          <span class="book-line book-line--2"></span>
          <span class="book-line book-line--3"></span>
        </div>
      </div>
      <div class="book-page">
        <div class="book-page-face book-page-face--front">
          <span class="book-line book-line--1"></span>
          <span class="book-line book-line--2"></span>
          <span class="book-line book-line--3"></span>
        </div>
        <div class="book-page-face book-page-face--back">
          <span class="book-line book-line--1"></span>
          <span class="book-line book-line--2"></span>
          <span class="book-line book-line--3"></span>
        </div>
      </div>
      <div class="book-page">
        <div class="book-page-face book-page-face--front">
          <span class="book-line book-line--1"></span>
          <span class="book-line book-line--2"></span>
          <span class="book-line book-line--3"></span>
        </div>
        <div class="book-page-face book-page-face--back">
          <span class="book-line book-line--1"></span>
          <span class="book-line book-line--2"></span>
          <span class="book-line book-line--3"></span>
        </div>
      </div>
      <div class="book-page">
        <div class="book-page-face book-page-face--front">
          <span class="book-line book-line--1"></span>
          <span class="book-line book-line--2"></span>
          <span class="book-line book-line--3"></span>
        </div>
        <div class="book-page-face book-page-face--back">
          <span class="book-line book-line--1"></span>
          <span class="book-line book-line--2"></span>

        </div>
      </div>
      <div class="book-spine"></div>
    </div>
  </div>
  <span class="book-label">Loading</span>
