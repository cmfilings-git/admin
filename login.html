<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F8F9FA">
    <title>COREBIQ | Login</title>
    
    <!-- Tailwind CSS for layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <style>
        /* ==========================================================================
           COREBIQ LOGIN - Brand Stylesheet (Embedded)
           Design System: Material Design 3 + Google Gemini Era
        ========================================================================== */
        :root {
            --md3-primary: #0B57D0;
            --md3-on-primary: #FFFFFF;
            --md3-primary-container: #D3E3FD;
            --md3-on-primary-container: #041E49;

            --md3-error: #B3261E;
            --md3-on-error: #FFFFFF;
            --md3-error-container: #F9DEDC;
            
            --md3-success: #146C2E;
            --md3-success-container: #C4EECE;

            --md3-surface: #F8F9FA;
            --md3-on-surface: #1F1F1F;
            --md3-on-surface-variant: #444746;
            
            --md3-surface-container-lowest: #FFFFFF;
            --md3-surface-container: #EDEDED;
            --md3-surface-container-high: #E8EAED;

            --md3-outline: #747775;
            --md3-outline-variant: #C4C7C5;

            /* Gemini Signature Colors */
            --gemini-blue: #4285F4;
            --gemini-purple: #9b72cb;
            --gemini-red: #d96570;
            --gemini-gradient: linear-gradient(90deg, var(--gemini-blue) 0%, var(--gemini-purple) 50%, var(--gemini-red) 100%);

            --font-brand: 'Outfit', sans-serif;
            --font-body: 'Roboto', sans-serif;

            --radius-md: 12px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            --md3-shadow-1: 0px 1px 2px 0px rgba(0, 0, 0, 0.30), 0px 1px 3px 1px rgba(0, 0, 0, 0.15);
            --md3-shadow-2: 0px 1px 2px 0px rgba(0, 0, 0, 0.30), 0px 2px 6px 2px rgba(0, 0, 0, 0.15);
        }

        body {
            margin: 0;
            font-family: var(--font-body);
            background-color: var(--md3-surface);
            color: var(--md3-on-surface);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Subtle background pattern */
            background-image: radial-gradient(circle at 10% 20%, rgba(66, 133, 244, 0.05) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(155, 114, 203, 0.05) 0%, transparent 20%);
        }

        .font-brand { font-family: var(--font-brand); }
        
        .text-gradient-gemini {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        /* Card Container */
        .login-card {
            background-color: var(--md3-surface-container-lowest);
            border: 1px solid rgba(196, 199, 197, 0.5);
            box-shadow: var(--md3-shadow-2);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 440px;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        /* Gemini Spark effect on top edge */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gemini-gradient);
            z-index: 11;
        }

        /* Buttons */
        .md3-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 48px;
            padding: 0 24px;
            border-radius: var(--radius-full);
            border: none;
            font-family: var(--font-brand);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .md3-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .md3-btn-ai {
            background: var(--gemini-gradient);
            color: white;
            border: none;
        }
        .md3-btn-ai:not(:disabled):hover {
            box-shadow: var(--md3-shadow-2);
            opacity: 0.95;
        }

        .md3-btn-outlined {
            background-color: transparent;
            border: 1px solid var(--md3-outline-variant);
            color: var(--md3-on-surface);
        }
        .md3-btn-outlined:not(:disabled):hover {
            background-color: var(--md3-surface-container);
        }

        .md3-btn-text {
            background-color: transparent;
            color: var(--md3-primary);
            height: auto;
            padding: 4px 8px;
            font-size: 14px;
            width: auto;
        }
        .md3-btn-text:hover {
            background-color: rgba(11, 87, 208, 0.05);
        }

        /* Inputs */
        .md3-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            margin-bottom: 20px;
        }
        .md3-input-label {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            color: var(--md3-on-surface-variant);
            margin-left: 12px;
        }
        .md3-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .md3-input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            color: var(--md3-on-surface-variant);
            pointer-events: none;
        }
        .md3-input-outlined {
            width: 100%;
            height: 56px;
            border-radius: var(--radius-md);
            border: 1px solid var(--md3-outline-variant);
            background-color: var(--md3-surface-container-lowest);
            color: var(--md3-on-surface);
            font-family: var(--font-body);
            font-size: 16px;
            padding: 0 16px 0 48px;
            transition: border-color 0.2s ease;
            outline: none;
        }
        .md3-input-outlined:focus {
            border: 2px solid var(--md3-primary);
            padding-left: 47px; /* Prevent jump when border thickens */
        }

        /* Custom Checkbox */
        .md3-checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .md3-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--md3-outline-variant);
            border-radius: 4px;
            background-color: var(--md3-surface-container-lowest);
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .md3-checkbox::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .md3-checkbox:checked {
            background-color: var(--md3-primary);
            border-color: var(--md3-primary);
        }
        .md3-checkbox:checked::before {
            transform: scale(1);
        }
        .md3-checkbox-label {
            font-size: 14px;
            color: var(--md3-on-surface-variant);
            user-select: none;
        }

        /* Error / Success Box */
        .error-box {
            display: none;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            background: var(--md3-error-container);
            color: var(--md3-error);
            font-size: 13px;
            font-weight: 500;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .error-box.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        .error-box.success-box {
            background: var(--md3-success-container);
            color: var(--md3-success);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ripple Effect */
        .ripple {
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
        }
        .ripple::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple-light::after { background-image: radial-gradient(circle, #fff 10%, transparent 10.01%); }
        .ripple:active::after { transform: scale(0, 0); opacity: .2; transition: 0s; }
    </style>
</head>
<body class="p-4 sm:p-6">

    <div class="login-card p-6 sm:p-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-[var(--md3-primary-container)] mb-4">
                <span class="material-symbols-rounded text-[var(--md3-primary)] text-[28px]">code_blocks</span>
            </div>
            <h1 class="text-3xl font-brand font-bold tracking-tight text-[var(--md3-on-surface)]">
                COREBIQ <span class="text-gradient-gemini">Access</span>
            </h1>
            <p class="text-[var(--md3-on-surface-variant)] text-sm mt-2">Sign in to your business workspace</p>
        </div>

        <!-- Alert Box -->
        <div id="error-box" class="error-box">
            <span class="material-symbols-rounded text-[20px]">error</span>
            <span id="error-message"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            
            <div class="md3-input-group">
                <label for="email" class="md3-input-label">Email Address</label>
                <div class="md3-input-wrapper">
                    <span class="material-symbols-rounded input-icon">mail</span>
                    <input type="email" id="email" class="md3-input-outlined" placeholder="name@company.com" required autocomplete="email">
                </div>
            </div>

            <div class="md3-input-group">
                <label for="password" class="md3-input-label">Password</label>
                <div class="md3-input-wrapper">
                    <span class="material-symbols-rounded input-icon">lock</span>
                    <!-- Extra padding-right to prevent text from hiding behind the toggle button -->
                    <input type="password" id="password" class="md3-input-outlined pr-12" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full text-[var(--md3-on-surface-variant)] hover:bg-gray-100 flex items-center justify-center transition-colors focus:outline-none ripple" onclick="window.togglePassword()" aria-label="Toggle password visibility">
                        <span id="toggle-icon" class="material-symbols-rounded text-[20px]">visibility</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between mb-8 mt-2">
                <label class="md3-checkbox-wrapper">
                    <input type="checkbox" id="remember-me" class="md3-checkbox">
                    <span class="md3-checkbox-label">Remember me</span>
                </label>
                
                <button type="button" class="md3-btn md3-btn-text ripple" onclick="window.handleForgotPassword()">
                    Forgot password?
                </button>
            </div>

            <button type="submit" id="login-btn" class="md3-btn md3-btn-ai ripple ripple-light">
                <span id="login-text">Sign In to Dashboard</span>
                <!-- Custom CSS Loader matching script expectations -->
                <div id="login-loader" style="display: none;">
                    <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                </div>
            </button>
        </form>

        <div class="relative flex py-6 items-center">
            <div class="flex-grow border-t border-[var(--md3-outline-variant)]"></div>
            <span class="flex-shrink-0 mx-4 text-[var(--md3-on-surface-variant)] text-xs uppercase font-semibold tracking-wider">Or continue with</span>
            <div class="flex-grow border-t border-[var(--md3-outline-variant)]"></div>
        </div>

        <!-- Google Auth -->
        <button type="button" id="google-btn" class="md3-btn md3-btn-outlined ripple" onclick="window.handleGoogleLogin()">
            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
        </button>

    </div>

    <!-- COREBIQ User Script -->
    <script type="module">
        // Import from your established firebase config module
        import { auth } from './firebase-config.js';
        import { 
            signInWithEmailAndPassword, 
            sendPasswordResetEmail, 
            GoogleAuthProvider, 
            signInWithPopup,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember-me');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginLoader = document.getElementById('login-loader');
        const googleBtn = document.getElementById('google-btn');
        const errorBox = document.getElementById('error-box');
        const errorMessage = document.getElementById('error-message');

        // UI: Toggle Password Visibility
        window.togglePassword = function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = document.getElementById('toggle-icon');
            // Using standard MD3 icons
            icon.innerText = type === 'password' ? 'visibility' : 'visibility_off';
        };

        function showError(message, isSuccess = false) {
            errorBox.className = isSuccess ? 'error-box active success-box' : 'error-box active';
            errorBox.querySelector('.material-symbols-rounded').innerText = isSuccess ? 'check_circle' : 'error';
            errorMessage.innerText = message;
        }

        function hideError() {
            errorBox.classList.remove('active', 'success-box');
        }

        function setBtnLoading(isLoading) {
            loginBtn.disabled = isLoading;
            googleBtn.disabled = isLoading;
            loginText.style.display = isLoading ? 'none' : 'block';
            loginLoader.style.display = isLoading ? 'block' : 'none';
        }

        // AUTH: Email & Password Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const rememberMe = rememberCheckbox.checked;

            if (!email || !password) {
                showError("Please enter your email and password.");
                return;
            }

            setBtnLoading(true);

            try {
                // Set persistence based on checkbox
                const persistenceType = rememberMe ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistenceType);

                // Execute Login
                await signInWithEmailAndPassword(auth, email, password);
                
                // Redirect to app
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Login error:", error);
                let msg = "Invalid email or password.";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msg = "Wrong email or password. Try again.";
                } else if (error.code === 'auth/too-many-requests') {
                    msg = "Access to this account has been temporarily disabled due to many failed login attempts. Try resetting your password.";
                } else if (error.code === 'auth/invalid-email') {
                    msg = "Please enter a valid email address.";
                }
                showError(msg);
                setBtnLoading(false);
            }
        });

        // AUTH: Google Login
        window.handleGoogleLogin = async function() {
            hideError();
            setBtnLoading(true);
            const provider = new GoogleAuthProvider();
            
            try {
                // Use local persistence for Google login by default
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, provider);
                
                // Redirect to app
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Google Login error:", error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError("Google sign-in failed. Please try again.");
                }
                setBtnLoading(false);
            }
        };

        // AUTH: Forgot Password
        window.handleForgotPassword = async function() {
            hideError();
            const email = emailInput.value.trim();
            
            if (!email) {
                showError("Enter your email address above, then click 'Forgot password?'.");
                emailInput.focus();
                return;
            }

            const btnOriginalText = loginText.innerText;
            loginText.innerText = "Sending...";
            loginBtn.disabled = true;

            try {
                await sendPasswordResetEmail(auth, email);
                showError("Password reset link sent! Check your inbox.", true);
            } catch (error) {
                console.error("Reset error:", error);
                if (error.code === 'auth/user-not-found') {
                    showError("No account found with this email.");
                } else if (error.code === 'auth/invalid-email') {
                    showError("Please enter a valid email address.");
                } else {
                    showError("Failed to send reset email. Please try again.");
                }
            } finally {
                loginText.innerText = btnOriginalText;
                loginBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
