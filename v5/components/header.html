<header class="desktop-topbar" aria-label="Workspace actions">
  <span class="desktop-topbar-spacer"></span>
  <div class="desktop-topbar-actions">
    <button
      class="desktop-topbar-icon"
      type="button"
      aria-label="Master search"
      aria-haspopup="dialog"
      aria-expanded="false"
      data-popover-target="mini-search"
    >
      <i data-lucide="search" aria-hidden="true"></i>
    </button>
    <button
      class="desktop-topbar-icon compliance-refresh-button"
      type="button"
      aria-label="Refresh compliance"
      title="Refresh compliance"
      data-compliance-refresh
    >
      <i data-lucide="refresh-cw" aria-hidden="true"></i>
    </button>
    <button
      class="desktop-topbar-icon notification-button"
      type="button"
      aria-label="Recent activity notifications"
      aria-haspopup="dialog"
      aria-expanded="false"
      data-popover-target="mini-notifications"
    >
      <i data-lucide="bell" aria-hidden="true"></i>
      <b aria-hidden="true"></b>
    </button>
    <button
      class="desktop-topbar-icon"
      type="button"
      aria-label="Open signed-in profile"
      aria-haspopup="dialog"
      aria-expanded="false"
      data-popover-target="mini-profile"
    >
      <i data-lucide="user-round" aria-hidden="true"></i>
    </button>
  </div>
</header>

<style>
  .desktop-topbar {
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    padding: 0 24px;
    background: rgba(255, 255, 255, 0.92);
    border-bottom: 1px solid var(--border-light, #e2e8f0);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-sizing: border-box;
  }

  :root[data-theme="dark"] .desktop-topbar,
  body[data-theme="dark"] .desktop-topbar {
    background: rgba(30, 31, 32, 0.92);
  }

  .desktop-topbar-spacer {
    flex: 1;
  }

  .desktop-topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .desktop-topbar-icon {
    position: relative;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 1px solid transparent;
    border-radius: var(--radius-btn, 6px);
    background: transparent;
    color: var(--ink-secondary, #444746);
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .desktop-topbar-icon:hover {
    background: var(--bg-tonal, #f0f4f9);
    color: var(--ink-primary, #1f1f1f);
  }

  .desktop-topbar-icon[aria-expanded="true"] {
    background: var(--primary-50, #f0f6ff);
    border-color: var(--primary-200, #a8c7fa);
    color: var(--primary-600, #0b57d0);
  }

  .desktop-topbar-icon:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring, 0 0 0 3px rgba(11, 87, 208, 0.2));
  }

  .desktop-topbar-icon i,
  .desktop-topbar-icon svg {
    width: 18px;
    height: 18px;
    stroke-width: 1.8;
  }

  .compliance-refresh-button {
    display: none;
  }

  body[data-page-title="Compliance"] .compliance-refresh-button {
    display: grid;
  }

  .notification-button b {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 7px;
    height: 7px;
    border: 1.5px solid var(--bg-surface, #ffffff);
    border-radius: 50%;
    background: var(--primary-600, #0b57d0);
  }

  @media (max-width: 900px) {
    .desktop-topbar {
      display: none;
    }
  }
</style>
