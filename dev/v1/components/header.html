<header class="desktop-topbar">
  <span class="desktop-topbar-spacer"></span>
  <div class="desktop-topbar-actions">
    <button class="desktop-topbar-icon" type="button" aria-label="Master search" aria-haspopup="dialog" aria-expanded="false" data-popover-target="mini-search">
      <i data-lucide="search"></i>
    </button>
    <button class="desktop-topbar-icon notification-button" type="button" aria-label="Recent activity notifications" aria-haspopup="dialog" aria-expanded="false" data-popover-target="mini-notifications">
      <i data-lucide="bell"></i><b aria-hidden="true"></b>
    </button>
    <button class="desktop-topbar-icon" type="button" aria-label="Open signed-in profile" aria-haspopup="dialog" aria-expanded="false" data-popover-target="mini-profile">
      <i data-lucide="user-round"></i>
    </button>
  </div>
</header>
<style>
.desktop-topbar{height:64px;position:sticky;top:0;z-index:60;display:flex;align-items:center;padding:0 28px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line,#e1e7f0);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.desktop-topbar-spacer{flex:1}
.desktop-topbar-actions{display:flex;align-items:center;gap:8px}
.desktop-topbar-icon{position:relative;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:#20242b;cursor:pointer}
.desktop-topbar-icon:hover{background:#f1f2f3}
.desktop-topbar-icon svg{width:19px;height:19px;stroke-width:1.8}
.notification-button b{position:absolute;top:7px;right:7px;width:7px;height:7px;border:1.5px solid #fff;border-radius:50%;background:#20242b}
@media(max-width:850px){.desktop-topbar{display:none}}
</style>
