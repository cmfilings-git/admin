<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)">
  <base href="../../../">
  <title>Company Overview | COREBIQ</title>

  <!-- Permanent Global Design System + Page CSS -->
  <link rel="stylesheet" href="css/core-ui.css">
  <link rel="stylesheet" href="modules/settings/company/company.css">
</head>
<body data-page-title="Settings">
  <div class="app-shell">
    <div id="desktop-sidebar-mount"></div>

    <main class="main-shell">
      <div id="desktop-header-mount"></div>
      <div id="mobile-header-mount"></div>

      <div class="module-container" id="company-module">
        <!-- Hero Header -->
        <header class="company-page-header">
          <div class="company-page-identity">
            <div class="company-page-icon" aria-hidden="true">
              <i data-lucide="building-2"></i>
            </div>
            <div class="company-page-heading">
              <h1>Company Overview</h1>
              <p>Manage your organization's details, contact information, and bank account.</p>
            </div>
          </div>

          <div class="company-toolbar-actions">
            <button
              type="button"
              class="btn btn-primary company-button company-button-primary"
              id="editCompanyBtn"
              onclick="window.toggleEditMode(true)"
            >
              <i data-lucide="pencil" aria-hidden="true"></i>
              <span>Edit details</span>
            </button>
          </div>
        </header>

        <!-- Company Profile Form Card -->
        <div class="ui-card form-card">
          <div class="company-toolbar">
            <p class="company-toolbar-copy">Review your saved company profile and make updates when needed.</p>
          </div>

          <form id="company-overview-form">
            <section class="company-form-section" aria-labelledby="general-info-heading">
              <h2 class="section-header" id="general-info-heading">
                <i data-lucide="building" aria-hidden="true"></i>
                <span>General information</span>
              </h2>
              <div class="input-group">
                <div>
                  <label class="form-label" for="compName">Company name</label>
                  <input type="text" id="compName" class="field form-input readonly-input" value="STRA CARE" readonly>
                </div>
                <div>
                  <label class="form-label" for="compTagline">Tagline</label>
                  <input type="text" id="compTagline" class="field form-input readonly-input" value="Rebuild Your Health" readonly>
                </div>
                <div>
                  <label class="form-label" for="compFloor">Floor</label>
                  <input type="text" id="compFloor" class="field form-input readonly-input" value="1st Floor" readonly>
                </div>
                <div>
                  <label class="form-label" for="compBuildingNo">Building number</label>
                  <input type="text" id="compBuildingNo" class="field form-input readonly-input" value="" readonly>
                </div>
                <div>
                  <label class="form-label" for="compBuildingName">Building name</label>
                  <input type="text" id="compBuildingName" class="field form-input readonly-input" value="Shakthi Complex" readonly>
                </div>
                <div>
                  <label class="form-label" for="compArea">Area</label>
                  <input type="text" id="compArea" class="field form-input readonly-input" value="Chokli" readonly>
                </div>
                <div>
                  <label class="form-label" for="compDistrict">District</label>
                  <input type="text" id="compDistrict" class="field form-input readonly-input" value="Kannur" readonly>
                </div>
                <div>
                  <label class="form-label" for="compPostalCode">Postal / ZIP code</label>
                  <input type="text" id="compPostalCode" class="field form-input readonly-input" value="670672" readonly>
                </div>
                <div>
                  <label class="form-label" for="compState">State / region</label>
                  <select id="compState" class="field form-input readonly-input" disabled></select>
                </div>
                <div>
                  <label class="form-label" for="compCountry">Country</label>
                  <select id="compCountry" class="field form-input readonly-input" disabled onchange="window.updateCompanyStates()">
                    <option value="IN">India</option>
                    <option value="AE">United Arab Emirates</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="CA">Canada</option>
                    <option value="AU">Australia</option>
                    <option value="SG">Singapore</option>
                    <option value="SA">Saudi Arabia</option>
                    <option value="QA">Qatar</option>
                    <option value="KW">Kuwait</option>
                    <option value="BH">Bahrain</option>
                    <option value="OM">Oman</option>
                    <option value="LK">Sri Lanka</option>
                    <option value="NP">Nepal</option>
                    <option value="BD">Bangladesh</option>
                    <option value="PK">Pakistan</option>
                    <option value="MY">Malaysia</option>
                    <option value="ZA">South Africa</option>
                    <option value="DE">Germany</option>
                    <option value="FR">France</option>
                    <option value="IT">Italy</option>
                    <option value="ES">Spain</option>
                    <option value="NL">Netherlands</option>
                    <option value="JP">Japan</option>
                    <option value="CN">China</option>
                    <option value="NZ">New Zealand</option>
                    <option value="IE">Ireland</option>
                    <option value="CH">Switzerland</option>
                    <option value="SE">Sweden</option>
                    <option value="NO">Norway</option>
                    <option value="DK">Denmark</option>
                    <option value="TR">Türkiye</option>
                    <option value="BR">Brazil</option>
                    <option value="MX">Mexico</option>
                  </select>
                </div>
                <div>
                  <label class="form-label" for="compCurrency">Currency</label>
                  <select id="compCurrency" class="field form-input readonly-input" disabled>
                    <option value="INR">INR — Indian Rupee</option>
                    <option value="AED">AED — UAE Dirham</option>
                    <option value="USD">USD — US Dollar</option>
                    <option value="EUR">EUR — Euro</option>
                    <option value="GBP">GBP — Pound Sterling</option>
                    <option value="CAD">CAD — Canadian Dollar</option>
                    <option value="AUD">AUD — Australian Dollar</option>
                    <option value="SGD">SGD — Singapore Dollar</option>
                    <option value="SAR">SAR — Saudi Riyal</option>
                    <option value="QAR">QAR — Qatari Riyal</option>
                    <option value="KWD">KWD — Kuwaiti Dinar</option>
                    <option value="BHD">BHD — Bahraini Dinar</option>
                    <option value="OMR">OMR — Omani Rial</option>
                    <option value="LKR">LKR — Sri Lankan Rupee</option>
                    <option value="NPR">NPR — Nepalese Rupee</option>
                    <option value="BDT">BDT — Bangladeshi Taka</option>
                    <option value="PKR">PKR — Pakistani Rupee</option>
                    <option value="MYR">MYR — Malaysian Ringgit</option>
                    <option value="ZAR">ZAR — South African Rand</option>
                    <option value="JPY">JPY — Japanese Yen</option>
                    <option value="CNY">CNY — Chinese Yuan</option>
                    <option value="CHF">CHF — Swiss Franc</option>
                    <option value="SEK">SEK — Swedish Krona</option>
                    <option value="NOK">NOK — Norwegian Krone</option>
                    <option value="DKK">DKK — Danish Krone</option>
                    <option value="TRY">TRY — Turkish Lira</option>
                    <option value="BRL">BRL — Brazilian Real</option>
                    <option value="MXN">MXN — Mexican Peso</option>
                  </select>
                </div>
                <div>
                  <label class="form-label" for="compLanguage">Preferred language</label>
                  <select id="compLanguage" class="field form-input readonly-input" disabled>
                    <option value="en">English</option>
                    <option value="ar">العربية — Arabic</option>
                    <option value="fr">Français — French</option>
                  </select>
                </div>
              </div>
            </section>

            <section class="company-form-section" aria-labelledby="contact-details-heading">
              <h2 class="section-header" id="contact-details-heading">
                <i data-lucide="mail" aria-hidden="true"></i>
                <span>Contact details</span>
              </h2>
              <div class="input-group">
                <div>
                  <label class="form-label" for="compPhone1">Primary contact number</label>
                  <input type="tel" id="compPhone1" class="field form-input readonly-input" value="+91 97449 02555" readonly>
                </div>
                <div>
                  <label class="form-label" for="compPhone2">Secondary contact number</label>
                  <input type="tel" id="compPhone2" class="field form-input readonly-input" value="+91 90612 07871" readonly>
                </div>
                <div>
                  <label class="form-label" for="compEmail">Email address</label>
                  <input type="email" id="compEmail" class="field form-input readonly-input" value="info@stracares.in" readonly>
                </div>
                <div>
                  <label class="form-label" for="compWebsite">Website</label>
                  <input type="text" id="compWebsite" class="field form-input readonly-input" value="www.stracares.in" readonly>
                </div>
              </div>
            </section>

            <section class="company-form-section" aria-labelledby="authorised-signatory-heading">
              <h2 class="section-header" id="authorised-signatory-heading">
                <i data-lucide="pen-tool" aria-hidden="true"></i>
                <span>Authorised signatory</span>
              </h2>
              <div class="input-group">
                <div>
                  <label class="form-label" for="compSignatoryName">Name</label>
                  <input type="text" id="compSignatoryName" class="field form-input readonly-input" readonly>
                </div>
                <div>
                  <label class="form-label" for="compSignatoryDesignation">Designation</label>
                  <input type="text" id="compSignatoryDesignation" class="field form-input readonly-input" readonly>
                </div>
                <div>
                  <label class="form-label" for="compSignatoryQualification">Qualification / Licence No.</label>
                  <input type="text" id="compSignatoryQualification" class="field form-input readonly-input" readonly>
                </div>
              </div>
            </section>

            <section class="company-form-section" aria-labelledby="bank-details-heading">
              <h2 class="section-header" id="bank-details-heading">
                <i data-lucide="landmark" aria-hidden="true"></i>
                <span>Bank details</span>
              </h2>
              <div class="input-group">
                <div>
                  <label class="form-label" for="compBankName">Bank name</label>
                  <input type="text" id="compBankName" class="field form-input readonly-input" readonly>
                </div>
                <div>
                  <label class="form-label" for="compAccName">Account name</label>
                  <input type="text" id="compAccName" class="field form-input readonly-input" value="STRA CARE" readonly>
                </div>
                <div>
                  <label class="form-label" for="compAccNo">Account number</label>
                  <input type="text" id="compAccNo" class="field form-input readonly-input" value="50200120597389" readonly>
                </div>
                <div>
                  <label class="form-label" for="compIfsc">IFSC code</label>
                  <input type="text" id="compIfsc" class="field form-input readonly-input" value="HDFC0000465" readonly>
                </div>
                <div>
                  <label class="form-label" for="compUpi">UPI / Mobile</label>
                  <input type="text" id="compUpi" class="field form-input readonly-input" value="9744902555@hdfc" readonly>
                </div>
              </div>
            </section>

            <footer id="save-actions" class="company-form-footer" hidden>
              <button
                type="button"
                class="btn btn-tonal company-button company-button-secondary"
                onclick="window.cancelCompanyEdit()"
              >
                Cancel
              </button>
              <button
                type="button"
                id="saveCompanyBtn"
                class="btn btn-primary company-button company-button-primary"
                onclick="window.saveCompanyDetails()"
              >
                <i data-lucide="save" aria-hidden="true"></i>
                <span id="save-company-label">Save changes</span>
              </button>
            </footer>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div id="app-sidebar-mount"></div>
  <div id="bottom-nav-mount"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/index.js"></script>
  <script type="module" src="modules/settings/company/company.js"></script>
</body>
</html>
