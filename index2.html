<header class="app-bar title-large">
  Gemini App
</header>

<main class="main-container">
  <!-- A section that spans the full width on all devices -->
  <section class="full-width">
    <h1 class="display-medium">Welcome</h1>
    <p class="body-large">This layout automatically scales from mobile to desktop.</p>
  </section>

  <!-- Side-by-side on tablet/desktop, stacked on mobile -->
  <aside class="sidebar card card-primary-container">
    <h2 class="title-medium">Navigation</h2>
    <p class="body-medium">Links go here.</p>
  </aside>

  <article class="content card">
    <h2 class="headline-small">Main Content</h2>
    <p class="body-medium">Content goes here.</p>
    <button class="btn-primary" style="margin-top: 16px; align-self: flex-start;">Action</button>
  </article>
</main>
