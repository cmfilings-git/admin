<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>Sign in · COREBIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global-typography.css">
  <link rel="stylesheet" href="../css/global-style.css">
</head>
<body class="login-page">
  <section class="login-card" aria-labelledby="loginTitle">
    <a class="brand" href="../index.html" aria-label="COREBIQ home">
      <img class="brand-mark" src="../assets/logo.png" alt="">
      <img class="brand-name-image" src="../assets/name.png" alt="COREBIQ">
    </a>
    <div class="eyebrow">Workspace access</div>
    <h1 class="title" id="loginTitle">Welcome back</h1>
    <p class="desc">Sign in to continue to your COREBIQ workspace. Access is restricted to authorized administrators.</p>
    <form id="loginForm">
      <div class="group">
        <label class="field-label" for="email">Email address</label>
        <input class="field" id="email" type="email" autocomplete="username" value="shanicm@gmail.com" required>
      </div>
      <div class="group">
        <label class="field-label" for="password">Password</label>
        <div class="password-wrap">
          <input class="field" id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="show" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="password-options">
        <label class="remember" for="rememberMe">
          <input id="rememberMe" type="checkbox" checked>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.75A1.75 1.75 0 0 1 7.75 3h8.5A1.75 1.75 0 0 1 18 4.75V21l-6-3.5L6 21V4.75Z"/></svg>
          <span>Remember me</span>
        </label>
        <button class="forgot" id="forgotPassword" type="button">Forgot password?</button>
      </div>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <p class="error" id="error" role="alert"></p>
      <button class="submit" id="submit" type="submit">Sign in securely <span aria-hidden="true">→</span></button>
    </form>
    <div class="secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Secure authentication powered by Firebase
    </div>
  </section>
  <script type="module" src="login.js"></script>
</body>
</html>
