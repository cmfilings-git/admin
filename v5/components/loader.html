<!-- /components/loader.html -->
<style>
  .app-loader-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .app-loader-overlay.is-active {
    opacity: 1;
    visibility: visible;
    pointer-events: all;
  }

  .app-loader-text {
    font-size: 0.875rem;
    font-weight: 500;
    color: #444746;
    margin: 0;
  }

  /* Paste the book loader CSS from "Copy Snippet" right here */
</style>

<div id="appLoader" class="app-loader-overlay" role="status" aria-live="polite" aria-busy="false">
  <!-- Paste the book loader HTML markup from "Copy Snippet" right here -->

</div>
