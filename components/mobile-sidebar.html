<!-- mobile-nav.html | Reusable ChatGPT-inspired light sidebar
     Include on any module page with:
     <div id="app-sidebar-mount"></div>
     <script src="/components/mobile-nav.js"></script>
     Or use the single-file loader shown in the accompanying instructions.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --mn-bg: #ffffff;
  --mn-page: #f7f7f8;
  --mn-hover: #ececee;
  --mn-active: #e8e8eb;
  --mn-text: #202123;
  --mn-muted: #6e6e80;
  --mn-border: #e5e5e7;
  --mn-width: 278px;
  --mn-shadow: 0 12px 40px rgba(0,0,0,.14);
  --mn-z: 9998;
}
#mn-sidebar, #mn-sidebar * { box-sizing: border-box; }
#mn-sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: var(--mn-z);
  width: var(--mn-width); max-width: min(86vw, 320px);
  background: var(--mn-bg); color: var(--mn-text);
  border-right: 1px solid var(--mn-border);
  display: flex; flex-direction: column;
  font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  transform: translateX(-102%); transition: transform .24s ease;
  box-shadow: none;
}
#mn-sidebar.mn-open { transform: translateX(0); box-shadow: var(--mn-shadow); }
#mn-backdrop {
  position: fixed; inset: 0; z-index: calc(var(--mn-z) - 1);
  background: rgba(0,0,0,.28); opacity: 0; visibility: hidden;
  transition: opacity .2s ease, visibility .2s ease;
}
#mn-backdrop.mn-show { opacity: 1; visibility: visible; }
.mn-head { padding: 13px 12px 10px; display:flex; align-items:center; justify-content:space-between; }
.mn-brand { display:flex; align-items:center; gap:9px; min-width:0; font-weight:600; font-size:15px; letter-spacing:-.25px; }
.mn-brand-mark { width:29px;height:29px;border:1.5px solid #202123;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px; }
.mn-icon-btn { border:0;background:transparent;color:var(--mn-muted);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer; }
.mn-icon-btn:hover { background:var(--mn-hover);color:var(--mn-text); }
.mn-icon-btn svg { width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round; }
.mn-actions { padding: 4px 8px 12px; display:grid; gap:3px; }
.mn-action, .mn-link {
  width:100%; min-height:39px; display:flex; align-items:center; gap:11px;
  border:0; border-radius:8px; padding:8px 10px; background:transparent;
  color:var(--mn-text); text-decoration:none; text-align:left; cursor:pointer;
  font:500 13.5px/1.3 Inter, sans-serif;
}
.mn-action:hover, .mn-link:hover { background:var(--mn-hover); }
.mn-action svg, .mn-link svg { flex:0 0 19px; width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round; }
.mn-search { margin:0 8px 12px; position:relative; }
.mn-search input { width:100%; height:37px; border:1px solid var(--mn-border);border-radius:8px;background:#fff;padding:0 12px 0 36px;outline:none;color:var(--mn-text);font:13px Inter,sans-serif; }
.mn-search input:focus { border-color:#b9b9c1; box-shadow:0 0 0 2px rgba(0,0,0,.04); }
.mn-search svg { position:absolute;left:11px;top:9px;width:18px;height:18px;stroke:var(--mn-muted);fill:none;stroke-width:1.8; }
.mn-scroll { overflow-y:auto; flex:1; padding:0 8px 12px; }
.mn-section-label { padding:8px 10px 6px; color:var(--mn-muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase; }
.mn-link { min-height:35px; font-weight:400; padding:7px 10px; font-size:13px; }
.mn-link.mn-current { background:var(--mn-active);font-weight:500; }
.mn-link span { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.mn-empty { padding:12px 10px;color:var(--mn-muted);font-size:12px;display:none; }
.mn-bottom { border-top:1px solid var(--mn-border);padding:10px 8px; }
.mn-profile { display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;color:var(--mn-text);text-decoration:none; }
.mn-profile:hover { background:var(--mn-hover); }
.mn-avatar { width:30px;height:30px;border-radius:50%;background:#d9e8f7;color:#245b8e;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 30px; }
.mn-profile-name { font-size:13px;font-weight:600; }
.mn-profile-sub { font-size:11px;color:var(--mn-muted);margin-top:1px; }
@media (min-width: 900px) {
  #mn-sidebar.mn-desktop-pinned { transform:translateX(0);box-shadow:none; }
  #mn-backdrop.mn-desktop-pinned { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  #mn-sidebar, #mn-backdrop { transition:none; }
}
</style>

<div id="mn-backdrop" aria-hidden="true"></div>
<aside id="mn-sidebar" aria-label="Main navigation" aria-hidden="true">
  <div class="mn-head">
    <div class="mn-brand">
      <div class="mn-brand-mark">C</div>
      <span data-mn-brand>COREBIQ</span>
    </div>
    <button class="mn-icon-btn" type="button" data-mn-close aria-label="Close sidebar" title="Close sidebar">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>

  <div class="mn-actions">
    <a class="mn-action" data-mn-href="dashboard" href="/dashboard.html">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/></svg>
      <span>Dashboard</span>
    </a>
    <button class="mn-action" type="button" data-mn-new>
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>New workspace</span>
    </button>
  </div>

  <div class="mn-search">
    <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
    <input type="search" placeholder="Search navigation" aria-label="Search navigation" data-mn-search>
  </div>

  <nav class="mn-scroll" aria-label="Modules">
    <div class="mn-section-label">Workspace</div>
    <a class="mn-link" data-mn-href="clients" href="/clients.html"><svg viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="4"/><path d="M20 20v-1.5a4 4 0 0 0-3-3.87M16 3.2a4 4 0 0 1 0 7.6"/></svg><span>Clients</span></a>
    <a class="mn-link" data-mn-href="appointments" href="/appointments.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Appointments</span></a>
    <a class="mn-link" data-mn-href="transactions" href="/transactions.html"><svg viewBox="0 0 24 24"><path d="M3 7h18M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M7 15h4"/></svg><span>Transactions</span></a>
    <a class="mn-link" data-mn-href="services" href="/services.html"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg><span>Services</span></a>
    <a class="mn-link" data-mn-href="reports" href="/reports.html"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 6-7"/></svg><span>Reports &amp; analytics</span></a>

    <div class="mn-section-label">Manage</div>
    <a class="mn-link" data-mn-href="team" href="/team.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5.5a3.5 3.5 0 0 1 0 6.8M17 14a5.5 5.5 0 0 1 4.5 5.4"/></svg><span>Staff &amp; team</span></a>
    <a class="mn-link" data-mn-href="settings" href="/settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z"/></svg><span>Settings</span></a>
    <div class="mn-empty" data-mn-empty>No matching modules</div>
  </nav>

  <div class="mn-bottom">
    <a class="mn-profile" href="/profile.html" data-mn-href="profile">
      <div class="mn-avatar" data-mn-avatar>CB</div>
      <div style="min-width:0">
        <div class="mn-profile-name" data-mn-user>Workspace account</div>
        <div class="mn-profile-sub" data-mn-plan>Manage account</div>
      </div>
    </a>
  </div>
</aside>

<script>
(function () {
  const sidebar = document.getElementById('mn-sidebar');
  const backdrop = document.getElementById('mn-backdrop');
  if (!sidebar || sidebar.dataset.initialized) return;
  sidebar.dataset.initialized = '1';

  const open = () => {
    sidebar.classList.add('mn-open');
    backdrop.classList.add('mn-show');
    sidebar.setAttribute('aria-hidden', 'false');
    backdrop.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.dispatchEvent(new CustomEvent('mobile-nav:open'));
  };
  const close = () => {
    sidebar.classList.remove('mn-open');
    backdrop.classList.remove('mn-show');
    sidebar.setAttribute('aria-hidden', 'true');
    backdrop.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    document.dispatchEvent(new CustomEvent('mobile-nav:close'));
  };

  window.openMobileNav = open;
  window.closeMobileNav = close;
  document.querySelectorAll('[data-mn-close]').forEach(el => el.addEventListener('click', close));
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  // Open with a right-swipe starting within the left 28px screen edge.
  let startX = 0, startY = 0, tracking = false;
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = startX <= 28 && !sidebar.classList.contains('mn-open');
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!tracking || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = Math.abs(e.changedTouches[0].clientY - startY);
    if (dx > 65 && dy < 90) open();
    tracking = false;
  }, { passive: true });

  // Close with a left swipe that begins inside the sidebar.
  let sideStartX = 0, sideStartY = 0, sideTracking = false;
  sidebar.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sideStartX = e.touches[0].clientX;
    sideStartY = e.touches[0].clientY;
    sideTracking = true;
  }, { passive: true });
  sidebar.addEventListener('touchend', e => {
    if (!sideTracking || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sideStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - sideStartY);
    if (dx < -65 && dy < 90) close();
    sideTracking = false;
  }, { passive: true });

  // Filter module links as the user types.
  const search = sidebar.querySelector('[data-mn-search]');
  const links = [...sidebar.querySelectorAll('.mn-link')];
  const empty = sidebar.querySelector('[data-mn-empty]');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    let visible = 0;
    links.forEach(link => {
      const show = link.textContent.toLowerCase().includes(q);
      link.style.display = show ? 'flex' : 'none';
      if (show) visible++;
    });
    empty.style.display = visible ? 'none' : 'block';
  });

  // Highlight the current module using data-mn-page on body, or the URL filename.
  const page = document.body.dataset.mnPage || location.pathname.split('/').pop().replace(/\.html?$/i, '');
  links.forEach(link => {
    const key = link.dataset.mnHref;
    if (key && key === page) {
      link.classList.add('mn-current');
      link.setAttribute('aria-current', 'page');
    }
  });

  // Optional configuration through window.COREBIQ_NAV before loading this file.
  const cfg = window.COREBIQ_NAV || {};
  if (cfg.brand) sidebar.querySelector('[data-mn-brand]').textContent = cfg.brand;
  if (cfg.user) sidebar.querySelector('[data-mn-user]').textContent = cfg.user;
  if (cfg.plan) sidebar.querySelector('[data-mn-plan]').textContent = cfg.plan;
  if (cfg.avatar) sidebar.querySelector('[data-mn-avatar]').textContent = cfg.avatar;
  if (Array.isArray(cfg.links)) {
    const nav = sidebar.querySelector('.mn-scroll');
    nav.innerHTML = '';
    cfg.links.forEach(item => {
      const a = document.createElement('a');
      a.className = 'mn-link';
      a.href = item.href || '#';
      a.dataset.mnHref = item.key || '';
      const span = document.createElement('span');
      span.textContent = item.label || 'Module';
      a.appendChild(span);
      if (item.key === page) a.classList.add('mn-current');
      nav.appendChild(a);
    });
  }
  const newBtn = sidebar.querySelector('[data-mn-new]');
  newBtn.addEventListener('click', () => {
    if (typeof cfg.onNewWorkspace === 'function') cfg.onNewWorkspace();
    else window.location.href = cfg.newWorkspaceUrl || '/dashboard.html';
  });
})();
</script>
