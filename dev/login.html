<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa">
<title>Sign in · COREBIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:Outfit, sans-serif;color:#20242b;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#eaf1ff 0,transparent 34%),radial-gradient(circle at 90% 90%,#e9f5f2 0,transparent 30%),#f7f8fa}.login-card{width:min(100%,420px);background:#fff;border:1px solid #e8ebf0;border-radius:25px;padding:34px;box-shadow:0 22px 70px #17243a12}.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}.brand-mark{width:44px;height:44px;border-radius:14px;background:#202b3c;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;letter-spacing:-2px}.brand-name{font-weight:700;font-size:18px;letter-spacing:.04em}.brand-sub{font-size:10px;color:#9299a4;letter-spacing:.16em;margin-top:2px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:#64748b;text-transform:uppercase}.title{font-size:29px;line-height:1.15;margin:9px 0 8px;font-weight:600;letter-spacing:-.04em}.desc{font-size:13px;color:#7a8492;line-height:1.6;margin:0 0 26px}.field-label{display:block;font-size:12px;font-weight:600;color:#596474;margin:0 0 7px}.field{width:100%;height:48px;border:1px solid #e1e6ed;border-radius:12px;padding:0 14px;font:14px Outfit;color:#252b34;outline:none;background:#fff}.field:focus{border-color:#6b8fc7;box-shadow:0 0 0 3px #6b8fc71c}.group{margin-bottom:17px}.password-wrap{position:relative}.password-wrap .field{padding-right:65px}.show{position:absolute;right:10px;top:8px;height:32px;border:0;background:transparent;color:#68758a;font:600 12px Outfit;cursor:pointer}.submit{width:100%;height:49px;border:0;border-radius:12px;background:#26364b;color:#fff;font:600 14px Outfit;cursor:pointer;margin-top:5px;transition:.2s}.submit:hover{background:#172638}.submit:disabled{opacity:.6;cursor:wait}.error{display:none;padding:11px 12px;border-radius:10px;background:#fff1f2;color:#be123c;font-size:12px;margin:0 0 14px}.foot{margin-top:24px;padding-top:18px;border-top:1px solid #f0f1f4;text-align:center;color:#a0a6b0;font-size:11px}.secure{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;color:#8993a1;font-size:11px}.secure svg{width:14px;height:14px}@media(max-width:420px){.login-card{padding:27px 23px;border-radius:21px}.title{font-size:26px}}
</style>
</head>
<body>
<section class="login-card" aria-labelledby="loginTitle">
  <div class="brand"><div class="brand-mark">C</div><div><div class="brand-name">COREBIQ</div><div class="brand-sub">BUSINESS MANAGEMENT</div></div></div>
  <div class="eyebrow">Workspace access</div><h1 class="title" id="loginTitle">Welcome back</h1><p class="desc">Sign in to continue to your COREBIQ workspace. Access is restricted to authorized administrators.</p>
  <form id="loginForm">
    <div class="group"><label class="field-label" for="email">Email address</label><input class="field" id="email" type="email" autocomplete="username" value="shanicm@gmail.com" required></div>
    <div class="group"><label class="field-label" for="password">Password</label><div class="password-wrap"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="show" id="togglePassword" type="button">Show</button></div></div>
    <p class="error" id="error" role="alert"></p><button class="submit" id="submit" type="submit">Sign in securely <span aria-hidden="true">→</span></button>
  </form>
  <div class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Secure authentication powered by Firebase</div>
  <div class="foot">© <span id="year"></span> COREBIQ · Count. Connect. Grow.</div>
</section>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "../firebase/firebase-config.js";
const ADMIN="shanicm@gmail.com";
const app=initializeApp(firebaseConfig),auth=getAuth(app),$=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const requested=params.get("next")||"index.html";
const safeNext=(!requested.startsWith("/")&&!requested.split("/").includes("..")&&!requested.includes(":")&&!requested.startsWith("\\"))?requested:"index.html";
const destination=new URL("../"+safeNext,location.href);
function showError(message){$("error").textContent=message;$("error").style.display="block"}
function go(){location.replace(destination.href)}
$("year").textContent=new Date().getFullYear();
$("togglePassword").onclick=()=>{const p=$("password");p.type=p.type==="password"?"text":"password";$("togglePassword").textContent=p.type==="password"?"Show":"Hide"};
onAuthStateChanged(auth,async user=>{if(!user)return;if(user.email?.toLowerCase()===ADMIN){go();return}await signOut(auth);showError("Access denied. This account is not authorized for COREBIQ administrator access.")});
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("error").style.display="none";const email=$("email").value.trim().toLowerCase();if(email!==ADMIN){showError("Only the authorized administrator can sign in.");return}$("submit").disabled=true;$("submit").textContent="Signing in…";try{await signInWithEmailAndPassword(auth,email,$("password").value)}catch(err){const messages={"auth/invalid-credential":"Incorrect email or password.","auth/too-many-requests":"Too many attempts. Please try again later.","auth/network-request-failed":"Network error. Check your internet connection."};showError(messages[err.code]||err.message||"Sign-in failed.")}finally{$("submit").disabled=false;$("submit").innerHTML='Sign in securely <span aria-hidden="true">→</span>'}});
</script>
</body></html>
