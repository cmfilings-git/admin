<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COREBIQ QR Scanner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        surface: '#F0F4F8',
                        textMain: '#1F1F1F',
                        textSecondary: '#444746',
                        btnBg: '#C2E7FF',
                        btnText: '#001D35',
                        linkText: '#0A56D1'
                    }
                }
            }
        }
    </script>
    <style>
        /* Ensuring strict height constraints for non-scrollable view */
        body {
            height: 100dvh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            background-color: #F0F4F8;
            position: relative;
        }
    </style>
</head>
<body class="font-sans antialiased text-textMain selection:bg-blue-200">

    <!-- Background Gradient Blobs -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0 flex justify-center">
        <!-- Left dominant blob -->
        <div class="absolute top-[45%] left-[-20%] w-[80vw] h-[40vh] bg-[#8AB4F8] rounded-full blur-[100px] opacity-50"></div>
        <!-- Center/Right soft blob -->
        <div class="absolute top-[55%] right-[-10%] w-[90vw] h-[45vh] bg-[#A8C7FA] rounded-full blur-[110px] opacity-45"></div>
    </div>

    <!-- Main Content Container -->
    <main class="relative z-10 flex flex-col h-[100dvh] w-full px-8 py-12">
        
        <!-- Top Section -->
        <div class="flex flex-col items-start mt-2">
            <!-- COREBIQ Logo -->
            <img src="assets/logo.png" alt="COREBIQ" width="42" height="42" class="mb-5 object-contain">

            <!-- Headings -->
            <h1 class="text-[2rem] font-medium text-textMain leading-tight tracking-tight">
                COREBIQ
            </h1>
            <p class="text-[1.05rem] text-textSecondary mt-4 leading-relaxed max-w-[95%]">
                Scan any QR code instantly. Open links, read text, and access QR code information with COREBIQ.
            </p>
        </div>

        <!-- Middle Section (Button) -->
        <div class="flex-grow flex items-center justify-center relative top-4">
            <div class="w-full flex flex-col items-center gap-4">
            <button id="start-scan" type="button" class="w-full bg-btnBg text-btnText rounded-full py-[1.1rem] flex justify-center items-center gap-2.5 font-medium transition-all active:scale-[0.98] active:bg-blue-200">
                <!-- QR Code Scanner Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                    <rect x="7" y="7" width="3" height="3" rx="0.5"/>
                    <rect x="14" y="7" width="3" height="3" rx="0.5"/>
                    <rect x="7" y="14" width="3" height="3" rx="0.5"/>
                    <path d="M14 14h3v3h-3z"/>
                </svg>
                Scan any QR code
            </button>

            <!-- Camera scanner (shown when scanning starts) -->
            <div id="scanner-panel" class="hidden w-full rounded-2xl bg-white/80 p-3 shadow-sm">
                <div id="qr-reader" class="w-full overflow-hidden rounded-xl"></div>
                <p id="scan-status" class="mt-3 text-center text-sm text-textSecondary">Starting camera…</p>
                <button id="stop-scan" type="button" class="mt-3 w-full rounded-full border border-gray-300 py-3 text-sm font-medium text-textMain">
                    Cancel scanning
                </button>
            </div>

            <!-- QR scan result -->
            <div id="scan-result" class="hidden w-full rounded-2xl bg-white/90 p-4 shadow-sm">
                <p class="text-sm font-medium text-textMain">QR code detected</p>
                <p id="qr-content" class="mt-2 break-all text-sm text-textSecondary"></p>
                <div class="mt-4 flex flex-col gap-2">
                    <a id="open-result" href="#" target="_blank" rel="noopener noreferrer"
                       class="hidden w-full rounded-full bg-btnBg py-3 text-center text-sm font-medium text-btnText">
                        Open link
                    </a>
                    <button id="copy-result" type="button"
                       class="w-full rounded-full border border-gray-300 py-3 text-sm font-medium text-textMain">
                        Copy QR content
                    </button>
                    <button id="scan-again" type="button"
                       class="w-full rounded-full py-3 text-sm font-medium text-linkText">
                        Scan another QR code
                    </button>
                </div>
            </div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div class="mt-auto flex flex-col items-center gap-2.5 pb-2">
            <span class="text-[0.9rem] text-textSecondary">
                Scan links, text, contacts and more.
            </span>
            <a href="#" class="text-[0.9rem] text-linkText font-medium hover:underline focus:outline-none">
                Powered by COREBIQ
            </a>
        </div>

    </main>

    <!-- QR decoding library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        let qrScanner = null;
        let isScanning = false;

        const startButton = document.getElementById("start-scan");
        const scannerPanel = document.getElementById("scanner-panel");
        const resultPanel = document.getElementById("scan-result");
        const scanStatus = document.getElementById("scan-status");
        const qrContent = document.getElementById("qr-content");
        const openResult = document.getElementById("open-result");

        async function stopScanner() {
            if (qrScanner && isScanning) {
                try {
                    await qrScanner.stop();
                    await qrScanner.clear();
                } catch (error) {
                    console.warn("Scanner stop:", error);
                }
            }
            isScanning = false;
            qrScanner = null;
        }

        async function startScanner() {
            if (!window.Html5Qrcode) {
                scanStatus.textContent = "QR scanner could not load. Check your internet connection.";
                scannerPanel.classList.remove("hidden");
                return;
            }

            startButton.classList.add("hidden");
            resultPanel.classList.add("hidden");
            scannerPanel.classList.remove("hidden");
            scanStatus.textContent = "Allow camera access to scan any QR code.";

            try {
                qrScanner = new Html5Qrcode("qr-reader");
                await qrScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                    async (decodedText) => {
                        if (!isScanning) return;
                        isScanning = false;
                        try {
                            await qrScanner.stop();
                            await qrScanner.clear();
                        } catch (error) {
                            console.warn("Scanner cleanup:", error);
                        }

                        scannerPanel.classList.add("hidden");
                        resultPanel.classList.remove("hidden");
                        qrContent.textContent = decodedText;

                        const isWebLink = /^https?:\/\//i.test(decodedText);
                        openResult.href = isWebLink ? decodedText : "#";
                        openResult.classList.toggle("hidden", !isWebLink);
                        startButton.classList.add("hidden");
                    },
                    () => {}
                );
                isScanning = true;
                scanStatus.textContent = "Point your camera at any QR code.";
            } catch (error) {
                isScanning = false;
                scanStatus.textContent = "Camera unavailable or permission denied. Please allow camera access and try again.";
                console.error(error);
            }
        }

        startButton.addEventListener("click", startScanner);

        document.getElementById("stop-scan").addEventListener("click", async () => {
            await stopScanner();
            scannerPanel.classList.add("hidden");
            startButton.classList.remove("hidden");
        });

        document.getElementById("scan-again").addEventListener("click", async () => {
            resultPanel.classList.add("hidden");
            startButton.classList.remove("hidden");
            startScanner();
        });

        document.getElementById("copy-result").addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(qrContent.textContent);
                document.getElementById("copy-result").textContent = "Copied";
            } catch (error) {
                document.getElementById("copy-result").textContent = "Copy unavailable";
            }
        });
    </script>
</body>
</html>
