<style>
  /* KPI Grid Container */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  /* Reusable KPI Mini Card */
  .kpi-mini {
    background: var(--bg-surface, #ffffff);
    border: 1px solid var(--border-light, #e2e8f0);
    border-radius: var(--radius-lg, 14px);
    padding: 20px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: var(--shadow-sm, 0 1px 2px rgba(4, 30, 73, 0.05));
    box-sizing: border-box;
    transition: border-color 0.15s ease;
  }

  .kpi-mini:hover {
    border-color: var(--border-mid, #cbd5e1);
  }

  /* Header Row */
  .kpi-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }

  .kpi-label {
    display: inline-flex;
    align-items: center;
    flex: 0 1 auto;
    min-width: 0;
    max-width: 100%;
    padding: 4px 10px;
    border-radius: var(--radius-sm, 6px);
    background: var(--primary-50, #f0f6ff);
    color: var(--primary-600, #0b57d0);
    font-family: var(--font-display, "Plus Jakarta Sans", sans-serif);
    font-size: 0.8125rem;
    font-weight: 500;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Square Icon Badge */
  .kpi-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-btn, 6px);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    background: var(--bg-tonal, #f0f4f9);
    color: var(--primary-900, #041e49);
  }

  .kpi-icon i,
  .kpi-icon svg {
    width: 18px;
    height: 18px;
    stroke-width: 1.8;
    display: block;
  }

  .kpi-icon.blue,
  .kpi-icon.green,
  .kpi-icon.orange,
  .kpi-icon.violet {
    background: var(--bg-tonal, #f0f4f9);
    color: var(--primary-900, #041e49);
  }

  /* Primary Metric Value */
  .kpi-value {
    font-family: var(--font-display, "Plus Jakarta Sans", sans-serif);
    font-size: 1.875rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink-primary, #1f1f1f);
    margin: 14px 0 6px;
    white-space: nowrap;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }

  /* Footer & Comparison Badges */
  .kpi-foot {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 0.75rem;
    line-height: 1.4;
    color: var(--ink-muted, #64748b);
  }

  .kpi-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    border-radius: var(--radius-sm, 6px);
    font-family: var(--font-display, "Plus Jakarta Sans", sans-serif);
    font-size: 0.6875rem;
    font-weight: 600;
    line-height: 1.2;
  }

  .kpi-badge i,
  .kpi-badge svg {
    width: 12px;
    height: 12px;
    stroke-width: 2.2;
  }

  .kpi-badge.positive {
    background: var(--status-complete-bg, #dcfce7);
    color: var(--status-complete-fg, #166534);
  }

  .kpi-badge.negative {
    background: var(--status-danger-bg, #fee2e2);
    color: var(--status-danger-fg, #b91c1c);
  }

  .kpi-badge.neutral {
    background: var(--bg-tonal, #f0f4f9);
    color: var(--ink-secondary, #444746);
  }

  .kpi-foot-text {
    color: var(--ink-muted, #64748b);
    font-weight: 400;
  }

  /* Tablet & Mobile: 2 cards per row */
  @media (max-width: 850px) {
    .kpi-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .kpi-top {
      gap: 8px;
    }

    .kpi-label {
      padding: 3px 8px;
      font-size: 0.6875rem;
    }

    .kpi-mini {
      padding: 16px;
      border-radius: var(--radius-md, 10px);
    }

    .kpi-value {
      font-size: 1.5rem;
      margin: 10px 0 4px;
    }

    .kpi-icon {
      width: 32px;
      height: 32px;
    }

    .kpi-icon i,
    .kpi-icon svg {
      width: 16px;
      height: 16px;
    }
  }

  /* Ultra-narrow screens: 1 card per row */
  @media (max-width: 350px) {
    .kpi-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
