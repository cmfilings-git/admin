<section class="modulepage-row2-grid" data-modulepage-row2 aria-label="Key metrics">
  <article class="modulepage-kpi-card" data-modulepage-kpi="1" data-kpi-tone="blue">
    <span class="modulepage-kpi-label" data-kpi-label></span>
    <strong class="modulepage-kpi-value" data-kpi-value>—</strong>
    <span class="modulepage-kpi-support" data-kpi-support hidden></span>
    <span class="modulepage-kpi-icon" aria-hidden="true"><i data-kpi-icon data-lucide="chart-no-axes-column"></i></span>
  </article>
  <article class="modulepage-kpi-card" data-modulepage-kpi="2" data-kpi-tone="amber">
    <span class="modulepage-kpi-label" data-kpi-label></span>
    <strong class="modulepage-kpi-value" data-kpi-value>—</strong>
    <span class="modulepage-kpi-support" data-kpi-support hidden></span>
    <span class="modulepage-kpi-icon" aria-hidden="true"><i data-kpi-icon data-lucide="chart-no-axes-column"></i></span>
  </article>
  <article class="modulepage-kpi-card" data-modulepage-kpi="3" data-kpi-tone="orange">
    <span class="modulepage-kpi-label" data-kpi-label></span>
    <strong class="modulepage-kpi-value" data-kpi-value>—</strong>
    <span class="modulepage-kpi-support" data-kpi-support hidden></span>
    <span class="modulepage-kpi-icon" aria-hidden="true"><i data-kpi-icon data-lucide="chart-no-axes-column"></i></span>
  </article>
  <article class="modulepage-kpi-card" data-modulepage-kpi="4" data-kpi-tone="red">
    <span class="modulepage-kpi-label" data-kpi-label></span>
    <strong class="modulepage-kpi-value" data-kpi-value>—</strong>
    <span class="modulepage-kpi-support" data-kpi-support hidden></span>
    <span class="modulepage-kpi-icon" aria-hidden="true"><i data-kpi-icon data-lucide="chart-no-axes-column"></i></span>
  </article>
</section>

<style>
.modulepage-row2-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}

.modulepage-kpi-card {
  --kpi-accent: #2563eb;
  position: relative;
  min-width: 0;
  min-height: 100px;
  padding: 15px 16px;
  border: 1px solid var(--line, #e7e9ed);
  border-radius: var(--radius-md, 15px);
  background: var(--surface, #fff);
  color: var(--text, #20242b);
}

.modulepage-kpi-card[data-kpi-tone="blue"] { --kpi-accent: #2563eb; }
.modulepage-kpi-card[data-kpi-tone="amber"] { --kpi-accent: #b45309; }
.modulepage-kpi-card[data-kpi-tone="orange"] { --kpi-accent: #c2410c; }
.modulepage-kpi-card[data-kpi-tone="red"] { --kpi-accent: #dc2626; }
.modulepage-kpi-card[data-kpi-tone="green"] { --kpi-accent: #15803d; }
.modulepage-kpi-card[data-kpi-tone="violet"] { --kpi-accent: #7c3aed; }

.modulepage-kpi-label {
  display: inline-flex;
  width: fit-content;
  max-width: calc(100% - 24px);
  padding: 3px 7px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--kpi-accent) 12%, var(--surface, #fff));
  color: var(--kpi-accent);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
}

.modulepage-kpi-value {
  display: block;
  margin-top: 8px;
  color: var(--kpi-accent);
  font-size: 23px;
  font-weight: 600;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.modulepage-kpi-support {
  display: block;
  margin-top: 4px;
  color: var(--kpi-accent);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.25;
}

.modulepage-kpi-support.is-warning { color: #b45309; }
.modulepage-kpi-support[hidden] { display: none; }

.modulepage-kpi-icon {
  position: absolute;
  top: 13px;
  right: 14px;
  color: var(--kpi-accent);
}

.modulepage-kpi-icon svg { width: 18px; height: 18px; stroke-width: 1.75; }

@media (max-width: 850px) {
  .modulepage-row2-grid { gap: 9px; }
  .modulepage-kpi-card { min-height: 92px; padding: 13px; }
  .modulepage-kpi-value { font-size: 21px; }
}

@media (min-width: 1280px) {
  .modulepage-row2-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
}
</style>
