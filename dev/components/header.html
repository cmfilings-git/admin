<header class="desktop-topbar">
  <div class="topbar-breadcrumb"><span class="breadcrumb-muted">Workspace</span><i data-lucide="chevron-right"></i><strong>Dashboard</strong></div>
  <div class="topbar-right">
    <button class="topbar-icon" type="button" aria-label="Search" id="desktop-search-button"><i data-lucide="search"></i></button>
    <button class="topbar-icon notification-button" type="button" aria-label="Notifications"><i data-lucide="bell"></i><b></b></button>
    <button class="topbar-user" type="button"><span class="user-avatar">CB</span><span>Workspace account</span><i data-lucide="chevron-down"></i></button>
  </div>
</header>
<style>
.desktop-topbar{height:60px;background:rgba(255,255,255,.94);border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:12px var(--font);backdrop-filter:blur(12px)}
.topbar-breadcrumb{display:flex;gap:9px;align-items:center}.breadcrumb-muted{color:#777}.topbar-breadcrumb strong{font-weight:600;color:#343434}.topbar-breadcrumb i{width:13px;color:#999}
.topbar-right{display:flex;align-items:center;gap:10px}.topbar-icon{width:35px;height:35px;border:0;border-radius:8px;background:transparent;color:#555;display:grid;place-items:center;cursor:pointer;position:relative}.topbar-icon i{width:18px}.topbar-icon:hover{background:#ececec}
.notification-button b{position:absolute;width:6px;height:6px;border-radius:50%;background:#10a37f;top:7px;right:8px}
.topbar-user{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#454545;font-size:11px;cursor:pointer}.topbar-user>i{width:14px;color:#777}
.user-avatar{width:28px;height:28px;border-radius:50%;background:#e5e5e5;color:#343434;display:grid;place-items:center;font-size:10px;font-weight:700}
@media(max-width:850px){.desktop-topbar{display:none}}
</style>
